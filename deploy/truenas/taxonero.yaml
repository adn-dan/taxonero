# taxonero on TrueNAS SCALE: Apps > Discover Apps > ⋮ > Install via YAML, paste this file.
# Before: create the data folder, owned by the apps user (568:568); for the GPU, tick
# "Install NVIDIA Drivers" in Apps > Configuration > Settings (and do not isolate the card for a VM).
# Replace POOL with the name of the pool, and fill in the dashboard password.
# Image built on the NAS instead (deploy/truenas/build.sh): image: taxonero:<variant>, pull_policy: never.
services:
  taxonero:
    image: ghcr.io/adn-dan/taxonero:latest-cuda13   # latest-cuda12 (driver < 580), latest-cpu (no GPU)
    pull_policy: always              # downloads latest again at every Edit > Save: that is the update
    restart: unless-stopped
    user: "568:568"                  # TrueNAS apps user, owner of the data folder
    environment:
      TZ: Europe/Paris
      DASHBOARD_PASSWORD: ""         # to fill in (user "nature"); empty: dashboard closed (error 503)
      DRY_RUN: "true"                # nothing is written to Immich; switch to "false" after review
      # Immich connection: set in the dashboard (Settings > Immich). Address as seen from the
      # container: that of the NAS and the port of the Immich app, for example http://192.168.1.10:30041.
      # Alternative: set it here (it is then locked in the dashboard).
      # IMMICH_URL: http://192.168.1.10:30041
      # IMMICH_API_KEY: ...
    volumes:
      - /mnt/POOL/apps/taxonero/data:/data   # database, backups, models (~5 GB)
      # - /mnt/POOL/photos:/photos              # SOURCE=local: photos from a folder instead of Immich
    ports:
      - "8765:8765"                  # dashboard
    mem_limit: 8g                    # beyond it, only this container is stopped, not Immich or the rest
    deploy:                          # NVIDIA GPU; remove for a cpu image
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
