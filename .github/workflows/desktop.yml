# Édition de bureau : un lanceur léger par système et processeur (packaging/bootstrap.py, ~35 Mo : uv, la roue
# de taxonero, ExifTool), construit à chaque tag vX.Y.Z et joint à la version GitHub. Pas de Docker. Au premier
# lancement, il installe dans le dossier de l'utilisateur le PyTorch adapté au GPU détecté (NVIDIA, AMD, Intel Arc,
# Apple Silicon, sinon processeur), comme ComfyUI Desktop ou Invoke. Inactif tant que le dépôt n'est pas publié.
# Mac Intel non pris en charge : PyTorch s'y est arrêté à la version 2.2.
name: desktop
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, name: windows-x64 }
          - { os: windows-11-arm, name: windows-arm64 }
          - { os: macos-15, name: macos-arm64 }
          - { os: ubuntu-24.04, name: linux-x64 }
          - { os: ubuntu-24.04-arm, name: linux-arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - name: Outils
        run: python -m pip install pyinstaller==6.22.3
      - name: uv, roue, ExifTool
        run: python packaging/prepare.py
      - name: Lanceur
        run: pyinstaller packaging/taxonero.spec --noconfirm --distpath dist --workpath build
      - name: Archive
        shell: bash
        run: |
          cd dist
          case "${{ runner.os }}" in
            Windows) 7z a "../taxonero-${{ matrix.name }}.zip" taxonero.exe ;;
            *)       tar -czf "../taxonero-${{ matrix.name }}.tar.gz" taxonero ;;
          esac
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: taxonero-${{ matrix.name }}
          path: taxonero-${{ matrix.name }}.*
      - name: Version GitHub
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2
        with:
          files: taxonero-${{ matrix.name }}.*
