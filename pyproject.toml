[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "taxonero"
version = "0.2.2"
description = "Self-hosted AI species identification for your photos: Immich, local folders or photo apps. Never modifies your pictures."
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-only"
dependencies = [
  "httpx>=0.27",
  "pydantic-settings>=2.4",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pillow>=10",
  "numpy>=1.26",
  "pybioclip>=2.1",
  "transformers>=4.45",   # OWLv2 (open-vocabulary detector)
  "mapbox-vector-tile>=2.0",  # GBIF range maps
  "pillow-heif>=1.7",   # HEIC photos (iPhone) of the "local folder" source
  # onnxruntime (CPU) or onnxruntime-gpu: installed depending on the target (see Dockerfile).
]

[project.optional-dependencies]
cpu = ["onnxruntime>=1.18"]
# Desktop edition: application window (taxonero desktop); on Linux with Qt (PyQt6 and its WebEngine).
desktop = ["pywebview>=6.1", "pywebview[qt]>=6.1; sys_platform == 'linux'"]
dev = ["pytest>=8", "playwright>=1.48"]   # browser tests: then "playwright install firefox"

[project.scripts]
taxonero = "taxonero.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
taxonero = ["static/*", "static/**/*", "rtdetr/configs/**/*.yml", "rtdetr/LICENSE", "rtdetr/NOTICE"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
