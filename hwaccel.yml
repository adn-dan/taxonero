# Access to the compute hardware, one variant per GPU value in .env (same principle as Immich's
# hwaccel.ml.yml). ./detect-gpu.sh picks the right one for this machine.
services:
  # No GPU: nothing to give the container.
  cpu: {}

  # NVIDIA: needs the NVIDIA Container Toolkit on the host (TrueNAS: GPU assigned to the app).
  cuda12: &nvidia
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
  cuda13: *nvidia

  # AMD (ROCm): untested. The container does not run as root: RENDER_GID (filled in by detect-gpu.sh) is the
  # group owning /dev/dri/renderD* and /dev/kfd on the host.
  rocm:
    devices:
      - /dev/kfd
      - /dev/dri
    group_add:
      - video
      - "${RENDER_GID:-video}"

  # Intel (Arc, Core Ultra): untested. Same group as for AMD.
  xpu:
    devices:
      - /dev/dri
    group_add:
      - "${RENDER_GID:-video}"
