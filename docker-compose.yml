# Docker deployment (Linux, Unraid, Synology, Portainer…): docker compose up -d, with the ready-made image from GHCR.
# Build the image yourself instead: docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
# TrueNAS SCALE: see deploy/truenas/.
# Fully separate from Immich: it only talks to it through its API, with a restricted key.
#
# Compute hardware: GPU variable in .env, filled in by ./detect-gpu.sh (cuda13, cuda12, rocm, xpu or cpu).
# It chooses both the image (taxonero:<version>-<GPU>) and the hardware access (hwaccel.yml).

services:
  taxonero:
    extends:
      file: hwaccel.yml
      service: ${GPU:-cpu}
    image: ghcr.io/adn-dan/taxonero:${VERSION:-latest}-${GPU:-cpu}
    container_name: taxonero
    env_file: .env
    environment:
      DASHBOARD_PORT: "8765"      # port in the container, always the same; DASHBOARD_PORT in .env: published port
    # TrueNAS SCALE: apps often run as 568:568; put here the uid owning ./data.
    user: "${PUID:-1000}:${PGID:-1000}"
    volumes:
      - ./data:/data              # SQLite database, GBIF cache, Hugging Face models (~5 GB)
      # - /path/to/my/photos:/photos   # SOURCE=local: photos from a folder instead of Immich
    ports:
      # Dashboard (protected by DASHBOARD_PASSWORD), over HTTP: password in clear text on the network. Outside a trusted
      # network, go through a TLS proxy and publish on "127.0.0.1:${DASHBOARD_PORT:-8765}:8765".
      - "${DASHBOARD_PORT:-8765}:8765"
    restart: unless-stopped
    mem_limit: ${MEM_LIMIT:-8g}   # beyond it, only this container is stopped, not Immich or the rest of the server
    # To reach Immich by its name (http://immich-server:2283), join its Docker network: uncomment
    # these lines and the two at the bottom (network name: docker network ls, often immich_default). Otherwise,
    # set in the dashboard the address of the machine and the published Immich port (http://192.168.1.10:2283).
    # networks: [default, immich]

# networks:
#   immich: { external: true, name: immich_default }
