# Build the image on this machine instead of downloading the GHCR one (code change, unpublished variant,
# machine without access to GHCR):
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
# 15 to 30 min the first time; the variant follows GPU in .env.
services:
  taxonero:
    build:
      context: .
      args:
        GPU: ${GPU:-cpu}
    image: taxonero:${GPU:-cpu}
