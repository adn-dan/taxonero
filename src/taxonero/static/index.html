<main>
  <div class="view" id="v-photos">
    <div class="pagehead"><h1 data-i18n="nav.photos"></h1><div class="chips" id="pfilters"></div></div>
    <!-- Single photo grid: moved into the record of a species or of a rank when you are there (homeGrid, embedGrid). -->
    <div id="pblock">
      <div class="ptools" id="ptools"></div>
      <div class="pwrap"><div id="pgrid"></div><nav id="ptimeline" hidden data-i18n-aria="photos.timeline"></nav></div>
      <div id="selbar" hidden></div>
    </div>
  </div>
  <div class="view" id="v-species"><div class="pagehead"><h1 data-i18n="nav.species"></h1></div><div id="species"></div></div>
  <div class="view" id="v-sp"><div id="sppage"></div></div>
  <div class="view" id="v-fa"><div id="fapage"></div></div>
  <div class="view" id="v-identify"><div class="pagehead"><h1 data-i18n="nav.identify"></h1></div><div id="identify"></div></div>
  <div class="view" id="v-stats"><div class="pagehead"><h1 data-i18n="nav.stats"></h1><a class="btn" style="margin-left:auto" id="b-export" href="/api/export.csv" data-i18n="stats.export"></a></div><div class="stats" id="stats"></div></div>
  <div class="view" id="v-settings"><div class="pagehead"><h1 data-i18n="nav.settings"></h1></div><div class="settings" id="settings"></div></div>
</main>

<div id="viewer" role="dialog" aria-modal="true" tabindex="-1">
  <div class="stage">
    <div class="vbar">
      <button class="iconbtn" id="v-close" data-i18n-title="viewer.close"><svg class="ic"><use href="#i-back"/></svg></button>
      <span class="title" id="v-title"></span>
      <span class="grow"></span>
      <button class="iconbtn" id="v-undo" data-i18n-title="viewer.undo"><svg class="ic"><use href="#i-undo"/></svg></button>
      <button class="iconbtn on" id="v-info" data-i18n-title="viewer.info"><svg class="ic"><use href="#i-info"/></svg></button>
      <button class="iconbtn" id="v-draw" data-i18n-title="viewer.draw"><svg class="ic"><use href="#i-draw"/></svg></button>
      <button class="iconbtn" id="v-rescan" data-i18n-title="bulk.reanalyze"><svg class="ic"><use href="#i-rescan"/></svg></button>
      <button class="iconbtn" id="v-cover" data-i18n-title="cover.set" hidden><svg class="ic"><use href="#i-star"/></svg></button>
      <a class="iconbtn" id="v-immich" target="_blank" rel="noopener" data-i18n-title="viewer.immich"><svg class="ic"><use href="#i-open"/></svg></a>
      <button class="iconbtn" id="v-del" data-i18n-title="action.delete_hint"><svg class="ic"><use href="#i-delete"/></svg></button>
    </div>
    <button class="navbtn prev" id="v-prev" data-i18n-title="viewer.prev"><svg><use href="#i-left"/></svg></button>
    <div id="frame"><div id="pz"><img id="photo" alt="" draggable="false"><div id="labels"></div></div></div>
    <button class="navbtn next" id="v-next" data-i18n-title="viewer.next"><svg><use href="#i-right"/></svg></button>
    <div class="drawhint" id="drawhint" data-i18n="viewer.draw_hint"></div>
    <div class="vdone card" id="vdone" hidden></div>
  </div>
  <aside class="info" id="vinfo">
    <div id="vi-body"></div>
    <section id="vi-mapsec"><div class="sectit" data-i18n="map.range"></div><div id="minimap"></div><div class="minicap" id="vi-mapcap"></div></section>
    <section class="keys" data-i18n="viewer.keys"></section>
  </aside>
</div>

<div id="locpick"></div>
<aside id="wiki">
  <div class="wbar">
    <button class="chip on" data-src="wikipedia" data-i18n="wiki.wikipedia"></button>
    <button class="chip" data-src="wikispecies">Wikispecies</button>
    <select id="wikilang" class="pill" data-i18n-title="wiki.lang"></select>
    <button class="iconbtn" id="wiki-x" data-i18n-title="viewer.close"><svg class="ic"><use href="#i-close"/></svg></button>
  </div>
  <div class="body" id="wikibody"></div>
</aside>
